version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "33 4 28 * *"
      timezone: Europe/Vienna
    open-pull-requests-limit: 15
    assignees:
      - awekas
    versioning-strategy: increase
    cooldown:
      default-days: 7
    ignore:
      # @types/node must match the minimum supported node.js version
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # chai, sinon-chai and chai-as-promised must stay compatible with @iobroker/testing
      - dependency-name: "*chai*"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 has no programmatic API yet; typescript-eslint (used by
      # @iobroker/eslint-config) supports only typescript < 6.1 - revisit with TypeScript 7.1
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "24 11 11 * *"
      timezone: Europe/Vienna
    open-pull-requests-limit: 15
    assignees:
      - awekas
